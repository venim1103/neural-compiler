name: Development Baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Python ${{ matrix.python }} CPU
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            lock: .devcontainer/requirements-py310.lock
          - python: "3.12"
            lock: .devcontainer/requirements.lock
    env:
      NEURAL_COMPILER_DEVICE: cpu
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check Out Source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set Up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            ${{ matrix.lock }}
            pyproject.toml
      - name: Install Locked Baseline
        run: |
          python -m pip install pip==25.2
          python -m pip install --require-hashes --only-binary=:all: \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r "${{ matrix.lock }}"
          python -m pip install --no-deps -e '.[dev]'
          python -m pip check
      - name: Ruff
        run: ruff check src tests .devcontainer/smoke.py
      - name: Pytest
        run: python -m pytest -q
      - name: Shellcheck
        run: shellcheck .devcontainer/prepare-build.sh
      - name: Offline Tiny-Model Smoke
        run: python .devcontainer/smoke.py
